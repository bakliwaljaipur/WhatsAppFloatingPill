name: Build WhatsApp Floating Pill APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Unpack source project
        run: |
          unzip -q WhatsAppFloatingPill_GitHub_CloudBuild_Pack.zip -d pack
          unzip -q pack/WhatsAppFloatingPill_Source_CloudBuild_v4.1.zip -d .
          test -f settings.gradle
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppFloatingPill-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
